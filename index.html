<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Luxor: Ancient Secrets</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Philosopher&display=swap');

        body, html {
            margin: 0; padding: 0;
            background: #000;
            height: 100vh; width: 100vw;
            overflow: hidden;
            font-family: 'Philosopher', sans-serif;
            color: #fcc201;
        }

        .tomb {
            position: relative; 
            width: 100vw; height: 100vh;
            background: url('2.png') center/cover no-repeat;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- UI TOP --- */
        .ui-top {
            position: absolute; top: 20px;
            width: 100%; display: flex; flex-direction: column;
            gap: 15px; align-items: center; z-index: 100;
        }
        .lives { display: flex; gap: 20px; }
        .ankh { font-size: 45px; color: #fcc201; text-shadow: 0 0 15px #fcc201; transition: 0.8s; }
        .ankh.lost { opacity: 0; transform: scale(0.5) translateY(50px); filter: blur(5px); }
        .progress-container { display: flex; gap: 8px; }
        .step { width: 35px; height: 12px; border: 2px solid #d4af37; background: rgba(0,0,0,0.8); transition: 0.6s; }
        .step.active { background: #fcc201; box-shadow: 0 0 20px #fcc201; }

        /* --- СКАРАБЕЙ --- */
        .scarab-wrap {
            position: absolute;
            width: 90px; height: 90px;
            z-index: 10;
            transition: transform 0.1s linear;
        }
        .scarab-img {
            width: 100%; height: 100%;
            background: url('1.png') center/contain no-repeat;
            filter: drop-shadow(0 0 10px #fcc201);
        }
        .wings-motion { animation: flap 0.3s infinite ease-in-out; }
        @keyframes flap {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
        }
/* --- НАСТОЯЩЕЕ ЗОЛОТО --- */
        #countdown-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Cinzel Decorative', cursive;
            font-size: 220px; /* Слегка увеличил для мощи */
            
            /* Яркий золотой градиент с выраженным бликом по центру */
            background: linear-gradient(
                to bottom, 
                #fcf3ad 0%,   /* Светлый верх */
                #fcc201 40%,  /* Золотая основа */
                #fffa8a 50%,  /* ЯРКИЙ БЛИК посередине */
                #d4af37 60%,  /* Темное золото */
                #8a6d1c 100%  /* Глубокий низ */
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Чистые тени без коричневой грязи */
            filter: drop-shadow(0 0 15px rgba(255, 250, 138, 0.6));
            text-shadow: 
                2px 2px 0px rgba(0,0,0,0.3), /* Легкий контур для четкости */
                0px 0px 30px rgba(252, 194, 1, 0.8); /* Золотое сияние */
            
            z-index: 3000;
            pointer-events: none;
            display: none;
            font-weight: 900;
        }

        .count-anim { animation: countZoom 0.8s ease-out forwards; }

        @keyframes countZoom {
            0% { 
                transform: translate(-50%, -50%) scale(0.3) rotate(-5deg); 
                opacity: 0; 
                filter: brightness(3) blur(15px);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.1) rotate(0deg); 
                opacity: 1; 
                filter: brightness(1.5) blur(0px);
            }
            100% { 
                transform: translate(-50%, -50%) scale(1.8) rotate(5deg); 
                opacity: 0; 
                filter: brightness(1);
            }
        }
        /* --- СТАРТОВЫЙ ЭКРАН --- */
        #start-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 4000;
        }

        /* --- ПЛАНШЕТ С ВОПРОСОМ --- */
        .tablet {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%; max-width: 450px; 
            background: rgba(10, 5, 0, 0.98);
            border: 2px solid #d4af37; padding: 30px;
            text-align: center; z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: 0.4s;
        }
        .tablet.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .choice-btn {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            background: #111; border: 1px solid #d4af37; color: #fcc201;
            font-family: 'Cinzel Decorative'; font-size: 18px;
            cursor: pointer; transition: 0.3s;
        }
        .choice-btn:hover { background: #fcc201; color: #000; }

        /* --- ЭФФЕКТ ШОКА --- */
        .shock-hit { 
            filter: brightness(0) invert(1) drop-shadow(0 0 50px #00ffff) !important; 
            animation: shockAnim 1.2s forwards;
            pointer-events: none;
        }
        @keyframes shockAnim {
            0% { transform: scale(1); }
            10%, 30%, 50% { transform: translate(15px, -15px); }
            20%, 40%, 60% { transform: translate(-15px, 15px); }
            100% { transform: scale(0); opacity: 0; filter: blur(30px); }
        }

        /* --- ПЕСОК --- */
        #sand-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; }
        .sand-particle { position: absolute; background: #fcc201; border-radius: 50%; box-shadow: 0 0 6px #d4af37; }
        #game-over-ui { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 2100; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="tomb" id="stage">
    <div id="start-screen">
        <h1 style="font-family:'Cinzel Decorative'; font-size: 60px; text-shadow: 0 0 20px #fcc201; margin-bottom: 20px;">LUXOR</h1>
        <button class="choice-btn" id="init-btn" style="max-width: 300px;">ENTER THE TOMB</button>
    </div>

    <div id="countdown-box"></div>

    <div class="ui-top">
        <div class="progress-container">
            <div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div>
            <div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div>
        </div>
        <div class="lives" id="lives-box">
            <span class="ankh">☥</span><span class="ankh">☥</span><span class="ankh">☥</span>
        </div>
    </div>

    <div id="sand-container"></div>
    <div id="game-over-ui">
        <h1 style="font-family:'Cinzel Decorative'; font-size: 50px; color: #fcc201; text-shadow: 0 0 20px #000;">BURIED ALIVE</h1>
        <button class="choice-btn" onclick="location.reload()">TRY AGAIN</button>
    </div>
    
    <div class="tablet" id="tablet">
        <h2 style="font-family: 'Cinzel Decorative'; color: #d4af37;">RIDDLE</h2>
        <p id="q-text" style="font-size: 2.2em; margin: 20px 0; color: #fff;"></p>
        <div id="options"></div>
    </div>
</div>

<script>
    const questions = [
        { q: "... apple", a: "an" }, { q: "... cat", a: "a" },
        { q: "... hour", a: "an" }, { q: "... dog", a: "a" },
        { q: "... ant", a: "an" }, { q: "... ball", a: "a" },
        { q: "... eye", a: "an" }, { q: "... tree", a: "a" },
        { q: "... ice", a: "an" }, { q: "... book", a: "a" }
    ];

    let currentIdx = 0;
    let lives = 3;

    function playSfx(file) {
        const audio = new Audio(file);
        audio.play().catch(() => {});
    }

    // ЛОГИКА СТАРТА
  // Слушатель для кнопки СТАРТ
    document.getElementById('init-btn').onclick = () => {
        document.getElementById('start-screen').style.display = 'none'; 
        // Звук запускаем ровно здесь
        playSfx('1.mp3'); 
        startCountdown(); 
    };

    function startCountdown() {
        const box = document.getElementById('countdown-box');
        const sequence = ['3', '2', '1', 'GO!'];
        box.style.display = 'block';

        let i = 0;
        
        // Функция для отображения шага
        function nextStep() {
            if (i < sequence.length) {
                box.innerText = sequence[i];
                box.classList.remove('count-anim');
                void box.offsetWidth; // Сброс анимации
                box.classList.add('count-anim');
                
                i++;
                // Ускоренный интервал — 800мс вместо 1000мс
                setTimeout(nextStep, 800); 
            } else {
                box.style.display = 'none';
                createScarab(); 
            }
        }

        nextStep(); // Запускаем первый шаг мгновенно
    }

    function createScarab() {
        const wrap = document.createElement('div');
        wrap.className = 'scarab-wrap';
        const img = document.createElement('div');
        img.className = 'scarab-img wings-motion';
        wrap.appendChild(img);
        document.getElementById('stage').appendChild(wrap);
        
        let x = Math.random() * (window.innerWidth - 100);
        let y = Math.random() * (window.innerHeight - 300) + 150;
        let angle = Math.random() * Math.PI * 2;
        let speed = 1.5; 
        let flip = 1; 
        let noise = Math.random() * 100;

        function drive() {
            if(wrap.dataset.stop === "true") return;
            noise += 0.02; 
            angle += Math.sin(noise) * 0.03; 
            x += Math.cos(angle) * speed;
            y += Math.sin(angle) * speed;

            const margin = 90;
            const topLimit = 110;
            if(x < 0) { angle = 0; flip = 1; x = 1; }
            else if(x > window.innerWidth - margin) { angle = Math.PI; flip = -1; x = window.innerWidth - margin - 1; }
            if(y < topLimit) { angle = Math.PI / 2; y = topLimit + 1; }
            else if(y > window.innerHeight - margin) { angle = -Math.PI / 2; y = window.innerHeight - margin - 1; }

            wrap.style.left = x + 'px';
            wrap.style.top = y + 'px';
            wrap.style.transform = `rotate(${angle + 1.57}rad)`;
            img.style.transform = `scaleX(${flip})`;
            requestAnimationFrame(drive);
        }
        drive();

        wrap.onclick = () => {
            playSfx('2.mp3');
            wrap.dataset.stop = "true";
            wrap.style.opacity = "0";
            window.lastScarab = wrap; 
            showQuest();
        };
    }

    function showQuest() {
        const q = questions[currentIdx];
        document.getElementById('q-text').innerText = q.q;
        const opt = document.getElementById('options');
        opt.innerHTML = '';
        ['a', 'an'].forEach(o => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = o;
            btn.onclick = () => check(o);
            opt.appendChild(btn);
        });
        document.getElementById('tablet').classList.add('active');
    }

    function check(ans) {
        document.getElementById('tablet').classList.remove('active');
        if(ans === questions[currentIdx].a) {
            playSfx('3.mp3');
            document.querySelectorAll('.step')[currentIdx].classList.add('active');
            currentIdx++;
            if(window.lastScarab) window.lastScarab.remove();
            if(currentIdx < questions.length) setTimeout(createScarab, 600);
            else { playSfx('5.mp3'); end("VICTORY!"); }
        } else {
            playSfx('4.mp3');
            lives--;
            const ankhs = document.querySelectorAll('.ankh');
            if(ankhs[lives]) ankhs[lives].classList.add('lost');
            const el = window.lastScarab;
            if (el) { el.style.opacity = "1"; el.classList.add('shock-hit'); }
            if(lives <= 0) { setTimeout(startSandstorm, 800); }
            else { setTimeout(createScarab, 1400); }
        }
    }

    function startSandstorm() {
        playSfx('6.mp3');
        const container = document.getElementById('sand-container');
        document.getElementById('game-over-ui').style.display = 'block';
        let floorLevel = 0;
        const storm = setInterval(() => {
            if (floorLevel > window.innerHeight) clearInterval(storm);
            for(let i=0; i<40; i++) { 
                const sand = document.createElement('div');
                sand.className = 'sand-particle';
                const size = Math.random() * 8 + 4;
                sand.style.width = size + 'px'; sand.style.height = size + 'px';
                sand.style.left = Math.random() * 100 + 'vw';
                container.appendChild(sand);
                const stopY = window.innerHeight - floorLevel - Math.random() * 40;
                sand.animate([{ top: '-50px', opacity: 1 }, { top: stopY + 'px', opacity: 1 }], 
                { duration: 400 + Math.random() * 400, fill: 'forwards' });
            }
            floorLevel += 12;
        }, 40);
    }

    function end(m) {
        document.getElementById('q-text').innerText = m;
        document.getElementById('options').innerHTML = '<button class="choice-btn" onclick="location.reload()">REPLAY</button>';
        document.getElementById('tablet').classList.add('active');
    }
</script>
</body>
</html>
